# Config consumed by the judge0/judge0:1.13.0 image (server + workers).
# See https://github.com/judge0/judge0/blob/master/judge0.conf for the full
# set of options — only the ones we need to override from defaults are here.

# Server
ENABLE_WAIT_RESULT=true
ENABLE_COMPILER_OPTIONS=true
ENABLE_COMMAND_LINE_ARGUMENTS=true
ENABLE_SUBMISSION_DELETE=false
ENABLE_CALLBACKS=false
ENABLE_ADDITIONAL_FILES=false
MAX_QUEUE_SIZE=100

# Postgresql (judge0's own instance, separate from the app's `postgres` service)
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0password

# Redis (judge0's own instance, separate from the app's `redis` service)
REDIS_HOST=judge0-redis
REDIS_PORT=6379
REDIS_PASSWORD=judge0password

# Workers
COUNT=2
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=20
MAX_MEMORY_LIMIT=512000
