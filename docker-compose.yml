services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: judge
      POSTGRES_PASSWORD: judge
      POSTGRES_DB: judge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"

  # piston (code execution engine, self-hosted) — used for DSA (non-SQL)
  # submissions. `privileged: true` is required by Piston's own sandboxing.
  # Language runtimes (python/go/java/c/c++) live in the `piston_data` volume,
  # installed via its package API — see README for setup.
  piston:
    image: ghcr.io/engineer-man/piston
    restart: unless-stopped
    privileged: true
    ports:
      - "2000:2000"
    volumes:
      - piston_data:/piston

volumes:
  postgres_data:
  piston_data:
